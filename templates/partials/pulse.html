{% let max = 300 %} {# TODO find max #}

<table class="entity_table">
    {% for entry in pulse %}
    <tr>
        <td class="timerange">{{ entry.time_range }}</td>
        <td class="amount">{{ entry.scrobbles }}</td>
        <td class="bar">
            {% let percent = 95 * entry.scrobbles / max %}
            <a href="/scrobbles?{{ entry.time_range.to_query().to_querystring() }}&{{ entity_limit.to_querystring() }}">
                <div style="width:{{ percent }}%;"></div>
            </a>
        </td>
    </tr>
    {% endfor %}
</table>
