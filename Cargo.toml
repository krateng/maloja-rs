[package]
name = "maloja-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# internal
maloja-dto = { path = "crates/maloja-dto", version = "0.1.0", features = ["chrono", "utoipa"] }
# proc
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
# logging
log = {  version = "0.4.22" }
fern = { version = "0.7.1" }
# serde
serde = { version = "1.0.216", features = ["derive"] }
serde_json = {  version = "1.0.134" }
serde-inline-default = { version = "1.0.3" }
serde_urlencoded = {  version = "0.7.1" }
serde_with = {  version = "3.25.0" }
# technical
regex = { version = "1.11.1" }
itertools = {  version = "0.15.0" }
strum = { version = "0.28.0", features = ["derive"] }
colored = { version = "3.0.0" }
base64 = {  version = "0.23.1" }
# web server
axum = { version = "0.8.1" }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header", "query"] }
axum-csp = {  version = "0.0.10" }
tower = { version = "0.5.2" }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
utoipa = { version = "6.0.0" }
utoipa-axum = { version = "0.3.0" }
rust-embed = {  version = "8.14.0", features = ["mime-guess"] }
form_urlencoded = { version = "1.2.2" }
# web rendering
askama = { version = "0.16.1" }
# outgoing network
reqwest = { version = "0.13.5", features = ["json"] }
# db
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite", "runtime-tokio-rustls", "macros", "sqlite-use-returning-for-3_35", "with-uuid"
] }
# crypto / random
rand = { version = "0.10.3", features = ["thread_rng"] }
sha2 = { version = "0.11.2" }
argon2 = { version = "0.6.0" }
# time
chrono = { version = "0.4.39" }
chrono-tz = {  version = "0.10.4" }
time = { version = "0.3.55" }
# config
confique = { version = "0.5.0", features = ["toml"] }
dotenvy = { version = "0.15.7" }
# fluff
csscolorparser = { version = "0.9.2" }

[dev-dependencies]
tempfile = { version = "3.14.0" }
http-body-util = { version = "0.1.2" }
