[package]
name = "maloja-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
maloja-dto = { path = "crates/maloja-dto", version = "0.1.0" }
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite", "runtime-tokio-rustls", "macros", "sqlite-use-returning-for-3_35", "with-uuid"
] }
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "macros"] }
confique = { version = "0.5.0", features = ["toml"] }
colored = { version = "3.0.0" }
log = {  version = "0.4.22" }
fern = { version = "0.7.1" }
chrono = { version = "0.4.39" }
chrono-tz = {  version = "0.10.4" }
axum = { version = "0.8.1" }
utoipa = { version = "6.0.0" }
utoipa-axum = { version = "0.3.0" }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = {  version = "1.0.134" }
serde-inline-default = { version = "1.0.3" }
rand = { version = "0.10.3", features = ["thread_rng"] }
regex = { version = "1.11.1" }
sea-query = { version = "1.0.2" }
strum_macros = "0.28.0"
strum = { version = "0.28.0" }
askama = { version = "0.16.1" }
serde_urlencoded = {  version = "0.7.1" }
reqwest = { version = "0.13.5", features = ["json"] }
tower = "0.5.2"
http-body-util = "0.1.2"
dotenvy = "0.15.7"
itertools = "0.15.0"
parse-display = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
axum-csp = "0.0.10"
rust-embed = {  version = "8.14.0", features = ["mime-guess"] }
time = "0.3.55"
getrandom = "0.4.3"
base64 = "0.23.1"
sha2 = "0.11.2"
serde_with = "3.25.0"
form_urlencoded = "1.2.2"
argon2 = "0.6.0"
csscolorparser = "0.9.2"

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.14.0"
